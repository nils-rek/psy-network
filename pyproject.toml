[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "psynet"
version = "0.1.0"
description = "Psychometric network analysis toolkit for Python"
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    # >=1.7: LassoCV(alphas=<int>) means "grid of that many alphas";
    # on older versions an int is a single penalty value (see timeseries/_var.py)
    "scikit-learn>=1.7",
    "networkx>=3.0",
    "matplotlib>=3.7",
    "joblib>=1.3",
]

[project.optional-dependencies]
multilevel = ["statsmodels>=0.14"]
lme4 = ["rpy2>=3.5"]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "statsmodels>=0.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/psynet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
